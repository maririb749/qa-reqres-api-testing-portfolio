name: Newman API Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: newman-api-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  newman-tests:
    name: Run Reqres API tests with Newman
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Newman
        run: npm install -g newman

      - name: Validate Reqres API key secret
        env:
          REQRES_API_KEY: ${{ secrets.REQRES_API_KEY }}
        run: |
          if [ -z "$REQRES_API_KEY" ]; then
            echo "REQRES_API_KEY secret is missing. Add it in GitHub: Settings > Secrets and variables > Actions > New repository secret."
            exit 1
          fi

      - name: Run Postman smoke tests
        env:
          REQRES_API_KEY: ${{ secrets.REQRES_API_KEY }}
        run: |
          mkdir -p evidence/reports/reqres-api-testing-portfolio/newman

          newman run postman/reqres-api-collection.json \
            -e postman/reqres-environment.json \
            --folder "01 - Smoke Tests" \
            --env-var baseUrl="https://reqres.in" \
            --env-var apiKey="$REQRES_API_KEY" \
            --env-var reqresEnv="prod" \
            --delay-request 8000 \
            --timeout-request 15000 \
            --reporters cli,junit \
            --reporter-junit-export evidence/reports/reqres-api-testing-portfolio/newman/newman-results.xml

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-results
          path: evidence/reports/reqres-api-testing-portfolio/newman/