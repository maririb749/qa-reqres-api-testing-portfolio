name: Newman API Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  newman-tests:
    name: Run Reqres API tests with Newman
    runs-on: ubuntu-latest

    env:
      BASE_URL: https://reqres.in
      REQRES_ENV: ci
      REQRES_API_KEY: ${{ secrets.REQRES_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Newman
        run: npm install -g newman

      - name: Run Postman collection
        run: |
          newman run postman/reqres-api-collection.json \
            -e postman/reqres-environment.json \
            --env-var baseUrl="$BASE_URL" \
            --env-var reqresEnv="$REQRES_ENV" \
            --env-var apiKey="$REQRES_API_KEY" \
            --reporters cli,junit \
            --reporter-junit-export newman-results.xml

      - name: Upload Newman test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-results
          path: newman-results.xml