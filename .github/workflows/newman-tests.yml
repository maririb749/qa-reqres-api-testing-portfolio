name: Newman API Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: newman-api-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  newman-tests:
    name: Run Reqres API tests with Newman
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Newman
        run: npm install -g newman

      - name: Validate files
        run: |
          test -f postman/reqres-api-collection.json || (echo "Collection not found" && exit 1)
          test -f postman/reqres-environment.json || (echo "Environment not found" && exit 1)

      - name: Run Postman collection
        run: |
          mkdir -p evidence/reports/reqres-api-testing-portfolio/newman

          newman run postman/reqres-api-collection.json \
            -e postman/reqres-environment.json \
            --env-var baseUrl="https://reqres.in" \
            --delay-request 8000 \
            --timeout-request 15000 \
            --reporters cli,junit \
            --reporter-junit-export evidence/reports/reqres-api-testing-portfolio/newman/newman-results.xml

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-results
          path: evidence/reports/reqres-api-testing-portfolio/newman/